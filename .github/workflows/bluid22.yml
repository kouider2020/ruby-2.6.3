name: Build Portable CMake 3.5.1 ARMHF

on:
  workflow_dispatch:

jobs:
  build-cmake-armhf:
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye

    env:
      CMAKE_VERSION: 3.5.1
      PREFIX: /opt/cmake-3.5.1-armhf

    steps:
      - name: Enable armhf architecture
        run: |
          dpkg --add-architecture armhf
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y \
            build-essential \
            curl \
            ca-certificates \
            gcc \
            g++ \
            make \
            crossbuild-essential-armhf \
            gcc-arm-linux-gnueabihf \
            libc6-dev:armhf \
            zlib1g-dev:armhf

      - name: Build native CMake (host)
        run: |
          curl -LO https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}.tar.gz
          tar xf cmake-${CMAKE_VERSION}.tar.gz
          mv cmake-${CMAKE_VERSION} cmake-host
          cd cmake-host
          ./bootstrap --prefix=/usr/local/cmake-host
          make -j$(nproc)
          make install

      - name: Cross-compile CMake for ARMHF
        run: |
          tar xf cmake-${CMAKE_VERSION}.tar.gz
          cd cmake-${CMAKE_VERSION}

          mkdir build && cd build

          /usr/local/cmake-host/bin/cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_INSTALL_PREFIX=${PREFIX} \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_USE_OPENSSL=OFF \
            -DCMAKE_USE_SYSTEM_ZLIB=ON

          make -j$(nproc)
          make install

      - name: Package CMake
        run: |
          tar czf cmake-3.5.1-armhf.tar.gz -C ${PREFIX} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmake-3.5.1-armhf
          path: cmake-3.5.1-armhf.tar.gz
